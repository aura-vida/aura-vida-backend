services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kusala-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - kusala-network

networks:
  kusala-network:
    driver: bridge
